<style>
/* Layout: one-column game console. Top-down play field, touch controls under it on phones, menus float over everything. */
:root{
  --night:#0d2433;
  --sea:#16405a;
  --parch:#f4e4bf;
  --parch-2:#e2c98f;
  --ink:#2b1b0e;
  --banana:#f6c624;
  --coral:#e0573f;
  --muted:#93b4c5;
  --rust:#8a3a12;
  --display:"Pirata One","Trattatello",fantasy,serif;
  --body:"Alegreya Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{color:var(--parch);font-family:var(--body);font-size:16px}
.app{max-width:980px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.7rem;color:var(--banana);line-height:1}
.where{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.screen{position:relative}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:10px;border:3px solid #061520;background:var(--sea);touch-action:none}
.dlg{position:absolute;left:14px;right:14px;bottom:14px;background:var(--parch);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:12px 16px 26px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.dlg:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.dlg .who{font-family:var(--display);font-size:1.4rem;color:var(--rust);line-height:1}
.dlg p{margin:6px 0 0;font-size:1.06rem;line-height:1.45;max-width:72ch}
.dlg .nx{position:absolute;right:14px;bottom:6px;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#8a6a2a}
.keys{margin:0;font-size:.85rem;color:var(--muted);line-height:1.6}
.keys kbd{font-family:var(--body);font-weight:800;color:var(--parch);background:var(--sea);border:1px solid #2c5c78;border-radius:4px;padding:0 6px}
.touch{display:flex;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tools{display:flex;gap:8px;align-items:center}
.rotate{display:none;margin:0;font-size:.85rem;color:var(--muted);text-align:center}
.joy{width:132px;height:132px;border-radius:50%;background:var(--sea);border:3px solid #2c5c78;position:relative;touch-action:none;flex:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--banana);border:3px solid var(--ink)}
.tbtns{display:grid;grid-template-columns:repeat(3,70px);gap:10px}
.tbtns button{width:70px;height:70px;border-radius:50%;font:inherit;font-weight:800;font-size:.85rem;color:var(--ink);background:var(--parch);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);touch-action:none}
.tbtns button.big{background:var(--banana)}
.tbtns button.sup{background:#d9c2f2}
.tbtns button.sup.ready{background:#c77dff;color:#fff;box-shadow:0 0 0 4px rgba(199,125,255,.45),0 3px 0 var(--ink)}
.menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(5,15,22,.62);overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--parch);color:var(--ink);border:3px solid var(--parch-2);border-radius:12px;padding:20px;max-width:580px;width:100%;box-shadow:0 8px 0 #061520;margin:auto}
.card h1{font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:1;margin:2px 0 6px;color:var(--rust);text-wrap:balance}
.card h2{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.05;margin:2px 0 4px;text-wrap:balance}
.card p{font-size:1.05rem;line-height:1.5;margin:6px 0 14px;max-width:65ch}
.eyebrow{font-size:.74rem!important;text-transform:uppercase;letter-spacing:.14em;color:#8a6a2a;font-weight:800;margin:0!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:800;color:var(--ink);background:#fff8e6;border:2px solid var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;text-align:left;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn.primary{background:var(--banana)}
.btn.imp{background:#8c0a14;color:#ffe0e0;border-color:#2b0005;box-shadow:0 3px 0 #2b0005}
.btn small{display:block;font-weight:500;font-size:.8rem;opacity:.8;margin-top:2px}
.cost{float:right;font-size:.82rem;font-weight:800;color:var(--rust);margin-left:10px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0}
.stats{font-size:.88rem;color:#6b5330;font-variant-numeric:tabular-nums}
.note{font-style:italic;color:#6b5330;margin:0 0 12px!important;font-size:.95rem!important}
.netbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sea);border:2px solid #2c5c78;border-radius:8px;padding:8px 12px;font-size:.9rem;font-weight:700}
.netbar span{min-width:0;overflow-wrap:anywhere}
.btn.small{padding:6px 10px;font-size:.85rem}
.fld{display:grid;gap:4px;font-weight:800;font-size:.85rem;margin:0 0 12px;max-width:280px}
.fld select{font:inherit;font-weight:700;color:var(--ink);background:#fff8e6;border:2px solid var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.fld input,.code{font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:#fff8e6;border:2px solid var(--ink);border-radius:8px;padding:9px 12px}
.code{width:7.5ch;text-transform:uppercase;letter-spacing:.2em;font-variant-numeric:tabular-nums}
.fld input:focus-visible,.code:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.chlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:8px 0 14px}
.chlist .sub{grid-column:1/-1;margin:10px 0 0}
.chk{display:flex;gap:8px;align-items:center;font-weight:800;font-size:.9rem;margin:0 0 10px;color:#8c0a14}
.chk input{width:18px;height:18px;accent-color:#8c0a14}
.sub{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:18px 0 6px;color:var(--rust)}
.mplist{display:grid;gap:8px;margin-bottom:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:640px){
  .dlg{position:static;margin-top:8px}
  .brand{font-size:1.4rem}
  .card h1{font-size:2.1rem}

@media (pointer:coarse) and (orientation:portrait){
  .rotate{display:block}
  .joy{width:128px;height:128px}
  .tbtns{grid-template-columns:repeat(3,60px);gap:8px}
  .tbtns button{width:60px;height:60px;font-size:.8rem}
}
/* Phone held sideways: the game fills the screen and the controls float over it. */
@media (pointer:coarse) and (orientation:landscape) and (max-height:560px){
  .app{max-width:none;padding-block:0;gap:0}
  .top,.keys,.rotate{display:none}
  .screen{display:flex;justify-content:center}
  canvas{width:auto;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:100%;border:0;border-radius:0}
  .touch{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;padding-block:0 max(10px,env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

  .joy{width:128px;height:128px;background:rgba(22,64,90,.55)}
  .tbtns{grid-template-columns:repeat(3,60px);gap:8px}
  .tbtns button{width:60px;height:60px;opacity:.88}
  .netbar{position:fixed;top:max(6px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:6;font-size:.75rem;padding:4px 8px;max-width:70vw}
  .dlg{position:absolute;margin-top:0;max-height:45%;overflow:auto}
  body.talking .touch{visibility:hidden}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

/* ================= Level loading & tiles ================= */
function tileAt(x,y){if(!L||x<0||y<0||x>=L.mw||y>=L.mh)return null;return L.grid[y][x]}
function solidPx(px,py){const ch=tileAt(Math.floor(px/T),Math.floor(py/T));return ch===null||SOLID.has(ch)}
function blocked(x,y,r){return solidPx(x-r,y-r)||solidPx(x+r,y-r)||solidPx(x-r,y+r)||solidPx(x+r,y+r)}
function moveBody(o,dx,dy,mode){if(mode==='free'){o.x=clamp(o.x+dx,16,L.mw*T-16);o.y=clamp(o.y+dy,16,L.mh*T-16);return}
  if(!blocked(o.x+dx,o.y,o.cr))o.x+=dx;if(!blocked(o.x,o.y+dy,o.cr))o.y+=dy}
function isFloorAt(x,y){const ch=tileAt(Math.floor(x/T),Math.floor(y/T));return ch!==null&&!SOLID.has(ch)}

function buildLevel(i,withEnemies){
  const def=LEVELS[i],rows=def.map,mh=rows.length,mw=Math.max(...rows.map(r=>r.length));
  L={D:diff(i),def,i,mw,mh,grid:[],enemies:[],proj:[],bombs:[],waves:[],patches:[],pickups:[],rail:[],exit:null,start:{x:0,y:0},shop:null,cleared:false,nearShop:false,endT:0};
  const spawns=[];
  for(let y=0;y<mh;y++){const row=[];for(let x=0;x<mw;x++){let ch=rows[y][x]??'#';const left=rows[y][x-1];
      if(ch==='.')ch=def.floor;
      else if(ch==='@'){L.start={x:x*T+16,y:y*T+16};ch=def.floor}
      else if(ch==='E'){L.exit={x:x*T+16,y:y*T+16};const nb=[rows[y-1]?.[x],rows[y+1]?.[x],rows[y][x-1],rows[y][x+1]];ch=nb.includes('W')&&def.exit!=='plank'?'p':def.floor}
      else if(SPAWN[ch]){spawns.push([SPAWN[ch],x*T+16,y*T+16]);ch=(left==='W'||left==='S'||FLOOR[left])?left:def.floor}
      row.push(ch)}L.grid.push(row)}
  for(let y=0;y<mh;y++)for(let x=0;x<mw;x++)if(L.grid[y][x]==='W'){for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])if(tileAt(x+dx,y+dy)==='p'){L.rail.push({x:x*T+16,y:y*T+16});break}}
  if(def.shop){let xs=[],ys=0;for(let y=0;y<mh;y++)for(let x=0;x<mw;x++)if(L.grid[y][x]==='M'){xs.push(x);ys=y}L.shop={x:(Math.min(...xs)+Math.max(...xs)+1)/2*T,y:ys*T};}
  L.gates={a:false,b:false};L.rocks=[];L.lights=[];L.pads=[];
  for(let y=0;y<mh;y++)for(let x=0;x<mw;x++){const c=L.grid[y][x];if(c==='L')L.lights.push([x*T+16,y*T+16,115]);if(c==='¥')L.pads.push({x:x*T+16,y:y*T+16})}
  if(withEnemies)for(const [k,x,y] of spawns)spawn(k,x,y,false);
  prerender();
  G.floats=[];G.parts=[];G.banner=null;G.playT=0;G.keys={};
  where.textContent=`Chapter ${i+1} of ${LEVELS.length} · ${def.name}`}
function makePlayer(x,y,slot){return{isPlayer:true,x,y,vx:0,vy:0,r:11,cr:10,face:0,cd:0,swingT:0,swingAng:0,inv:0,dashT:0,dashCd:0,dashDir:0,kx:0,ky:0,jaw:0,jawLock:false,lastBite:-9,biteCd:0,poison:0,poisonTick:0,walk:0,moving:false,hp:S.maxHp,down:false,reviveT:0,slot,name:'',local:false,peer:null,s:0,e:0,q:0,u:0,sup:0,combo:0,comboT:0,starT:0,pepperT:0,spinT:0,tpLock:false}}
function spotNear(k){const o=[[0,0],[30,0],[-30,0],[0,30]][k%4];const x=L.start.x+o[0],y=L.start.y+o[1];return blocked(x,y,10)?[L.start.x,L.start.y]:[x,y]}
const introLines=def=>def.intro.map(([w,t])=>[w,t==='CONTROLS'?(TOUCH?CONTROLS_TOUCH:CONTROLS_DESK):t]);
function loadLevel(i,retry){buildLevel(i,true);
  const others=PL.filter(p=>!p.local);P=makePlayer(L.start.x,L.start.y,0);P.local=true;P.name=NET.name;PL=[P,...others];
  PL.forEach((p,k)=>{if(k){[p.x,p.y]=spotNear(k)}p.hp=S.maxHp;p.down=false;p.reviveT=0;p.inv=0;p.poison=0;p.jaw=0;p.jawLock=false});
  S.level=i;S.done=false;L.snapshot=JSON.stringify(S);save();NET.ep++;
  if(retry){G.mode='play'}else dialog(introLines(L.def),()=>{},'i')}
function openGates(k,quiet){if(L.gates[k])return;L.gates[k]=true;const g=k==='a'?'Ø':'Þ';for(const row of L.grid)for(let x=0;x<row.length;x++)if(row[x]===g)row[x]=L.def.floor;prerender();if(!quiet){banner(k==='a'?'A blue gate rumbles open!':'A red gate rumbles open!');G.shake=Math.max(G.shake,.3)}}

  for(let y=0;y<L.mh;y++)for(let x=0;x<L.mw;x++)drawTile(g,x,y);L.canvas=c}

/* ================= Entities ================= */
let EID=0;
function spawn(key,x,y,minion){const d=ENEMY[key];const e={id:++EID,key,def:d,x,y,r:15*d.size,cr:Math.min(14,15*d.size*.8),hp:Math.round(d.hp*L.D.hp),maxHp:Math.round(d.hp*L.D.hp),peel:Math.round((d.peel||0)*L.D.hp),maxPeel:Math.round((d.peel||0)*L.D.hp),t:Math.random()*5,cd:rnd(.8,2),shootCd:2,summonCd:7,waveCd:3,alpha:1,dead:false,wt:0,wa:0,pause:false,flip:false,hitFlash:0,peeledT:0,windT:0,dashT:0,dashDir:0,minion,state:'swim',upT:0,tx:x,ty:y,ang:Math.random()*6,aggro:minion,landed:false,moving:false,trail:[],atkCd:2.5,atkI:0,enraged:false,slam:null,air:0};

function pickWhaleTarget(e){const r=L.rail;if(!r.length){e.tx=e.x;e.ty=e.y;return}const sorted=r.map(p=>[p,Math.hypot(p.x-P_x(),p.y-P_y())]).sort((a,b)=>a[1]-b[1]).slice(0,6);const p=sorted[Math.floor(Math.random()*sorted.length)][0];e.tx=p.x;e.ty=p.y}

function nearestPlayer(x,y){let best=null,bd=1e9;for(const p of PL){if(p.down)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=p}}return best}
function addParts(x,y,color,n,sp=140){if(RM)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=Math.random()*6.28,v=rnd(40,sp);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.35,.7),max:.7,color,r:rnd(2,4)})}}

/* ================= Player actions ================= */
function hittable(e){return!e.dead&&!e.fade&&(e.def.ai!=='whale'||e.state==='up')}
function isPeeled(e){return e.maxPeel>0&&e.peel<=0}
function swing(pl){const P=pl;if(P.cd>0||P.down)return;P.cd=.32;P.swingT=.2;
  let best=null,bd=110;for(const e of L.enemies){if(!hittable(e))continue;const d=Math.hypot(e.x-P.x,e.y-P.y)-e.r;if(d<bd){bd=d;best=e}}
  if(best)P.face=Math.atan2(best.y-P.y,best.x-P.x);P.swingAng=P.face;
  for(const e of L.enemies){if(!hittable(e))continue;const dd=Math.hypot(e.x-P.x,e.y-P.y);if(dd>e.r+50)continue;const a=Math.atan2(e.y-P.y,e.x-P.x);if(dd>e.r+14&&Math.abs(angDiff(a,P.swingAng))>1.25)continue;hitEnemy(e,P)}}
function hitEnemy(e,P){const d=e.def,a=Math.atan2(e.y-P.y,e.x-P.x);e.hitFlash=.12;
  if(e.maxPeel>0&&e.peel>0){
    if(d.needDiamond&&!S.sword){addFloat(e.x,e.y-e.r-12,'CLANG!','#ffffff');addParts(e.x,e.y,'#ffffff',5);return}
    const dmg=roll(power(P)*(S.sword?2:1));e.peel=Math.max(0,e.peel-dmg);addFloat(e.x,e.y-e.r-12,`-${dmg} ${d.skin||'peel'}`,'#f6c624');addParts(e.x,e.y,d.fruit?FRUIT[d.fruit].skin:'#f6c624',7);credit(P,4);
    if(e.peel===0){e.peeledT=0;e.windT=0;e.dashT=0;addFloat(e.x,e.y-e.r-38,SKIN_OFF[d.skin||'peel']+(TOUCH?' Eat it!':' Eat it (K)'),'#fff4c9');if(d.ai==='whale')e.upT=Math.max(e.upT,2)}
    if(!d.boss)knock(e,a,22)}
  else if(e.maxPeel>0){if(G.t-(e.hintT||0)>1){e.hintT=G.t;addFloat(e.x,e.y-e.r-12,'Eat it!','#fff4c9')}}
  else{const dmg=roll(power(P));e.hp-=dmg;addFloat(e.x,e.y-e.r-12,`-${dmg}`,'#ffffff');addParts(e.x,e.y,d.color,6);credit(P,4);if(!d.boss)knock(e,a,26);if(e.hp<=0)kill(e,P)}}
function knock(e,a,f){if(e.def.ai==='whale')return;moveBody(e,Math.cos(a)*f,Math.sin(a)*f,(e.def.ai==='flyer'||e.def.ai==='blimp')&&!e.landed?'free':'walk')}
function eat(pl){const P=pl;if(P.biteCd>0||P.down)return;if(P.jawLock){if(P.local)hint('Jaw too tired! Wait a moment.');return}
  let best=null,bd=1e9;for(const e of L.enemies){if(!hittable(e)||!isPeeled(e))continue;const dd=Math.hypot(e.x-P.x,e.y-P.y)-e.r;if(dd<34&&dd<bd){bd=dd;best=e}}
  if(!best){P.biteCd=.2;if(P.local)hint(L.enemies.some(e=>hittable(e)&&isPeeled(e))?'Get closer to eat':'Peel an enemy first');return}
  const d=best.def,dmg=roll(power(P)*1.6*(d.tough||1));best.hp-=dmg;best.hitFlash=.1;
  P.jaw=Math.min(100,P.jaw+22+(d.tough?12:0));P.lastBite=G.t;P.biteCd=.28;P.face=Math.atan2(best.y-P.y,best.x-P.x);
  addFloat(best.x,best.y-best.r-12,`CHOMP -${dmg}`,'#fff4c9');addParts(best.x,best.y,d.fruit?FRUIT[d.fruit].flesh:'#fbf0c6',8);
  if(d.tough&&Math.random()<.3)addFloat(best.x,best.y-best.r-40,'So chewy!','#ef8a2c');
  if(P.jaw>=100){P.jawLock=true;addFloat(P.x,P.y-64,'Jaw tired!','#ef8a2c')}
  credit(P,12);if(best.hp<=0)kill(best,P)}
function dash(pl){const P=pl;if(P.dashCd>0||P.down)return;P.dashT=.17;P.dashCd=.7;P.dashDir=P.face;addParts(P.x,P.y+6,'rgba(255,255,255,.8)',6,80)}
function snack(pl){const P=pl;if(P.down)return;if(S.snacks<=0){if(P.local)hint('No snacks left');return}if(P.hp>=S.maxHp){if(P.local)hint('Already at full health');return}S.snacks--;const h=Math.round(S.maxHp*.5);P.hp=Math.min(S.maxHp,P.hp+h);addFloat(P.x,P.y-60,`+${h}`,'#9be37a');addParts(P.x,P.y,'#9be37a',8)}
function credit(pl,amt){if(!pl)return;pl.sup=Math.min(100,(pl.sup||0)+amt);pl.combo=(pl.combo||0)+1;pl.comboT=2.2;if(pl.combo>=5&&pl.combo%5===0)addFloat(pl.x,pl.y-92,`Combo x${pl.combo}!`,'#ff9f7a')}
function superAttack(pl){const P=pl;if(P.down)return;if((P.sup||0)<100){if(P.local)hint('Your Super meter is not full yet');return}
  P.sup=0;P.inv=Math.max(P.inv,1);P.spinT=.6;G.shake=Math.max(G.shake,.4);addFloat(P.x,P.y-92,'FRUIT FRENZY!','#c77dff');addParts(P.x,P.y,'#c77dff',30,320);
  L.proj=L.proj.filter(q=>Math.hypot(q.x-P.x,q.y-P.y)>170);
  for(const e of L.enemies){if(!hittable(e))continue;const d=e.def,dd=Math.hypot(e.x-P.x,e.y-P.y);if(dd>e.r+140)continue;const a=Math.atan2(e.y-P.y,e.x-P.x);e.hitFlash=.2;
    if(e.maxPeel>0){if(d.needDiamond&&!S.sword)continue;if(e.peel>0){const dmg=roll(power(P)*5*(S.sword?2:1));e.peel=Math.max(0,e.peel-dmg);addFloat(e.x,e.y-e.r-12,`-${dmg} ${d.skin||'peel'}`,'#c77dff');if(e.peel===0){e.peeledT=0;e.windT=0;e.dashT=0}}}
    else{const dmg=roll(power(P)*4);e.hp-=dmg;addFloat(e.x,e.y-e.r-12,`-${dmg}`,'#c77dff');if(e.hp<=0)kill(e,P)}
    if(!d.boss)knock(e,a,60)}}
function hurtPlayer(pl,dmg,fx,fy,poison){if(!pl||pl.down||pl.inv>0||pl.dashT>0||pl.starT>0||G.mode!=='play')return;dmg=Math.round(dmg*L.D.dm);pl.hp=Math.max(0,pl.hp-dmg);pl.inv=.8;
  if(pl.local){const a=Math.atan2(pl.y-fy,pl.x-fx);pl.kx=Math.cos(a)*260;pl.ky=Math.sin(a)*260;G.shake=Math.max(G.shake,.2)}
  addFloat(pl.x,pl.y-50,`-${dmg}`,'#ff7b6b');
  if(poison&&Math.random()<poison){pl.poison=4;pl.poisonTick=1;addFloat(pl.x,pl.y-74,'Poisoned!','#b9e27a')}
  if(pl.hp<=0){pl.down=true;pl.reviveT=0;pl.poison=0;addFloat(pl.x,pl.y-80,PL.length>1?'Knocked out! Help!':'Knocked out!','#ff7b6b');if(PL.every(p=>p.down))die()}}
function gainXP(n){S.xp+=n;while(S.xp>=S.lvl*20){S.xp-=S.lvl*20;S.lvl++;S.maxHp+=10;S.atk+=3;PL.forEach(p=>{if(!p.down)p.hp=S.maxHp});addFloat(P.x,P.y-80,'LEVEL UP!','#f6c624');banner(`Level ${S.lvl}! More health and strength.`)}}
function kill(e,pl){if(e.dead)return;e.dead=true;e.hp=0;const d=e.def;if(pl)credit(pl,15);
  addParts(e.x,e.y,d.ai==='snake'?d.color:d.fruit?FRUIT[d.fruit].flesh:'#fff4c9',18,200);addFloat(e.x,e.y-e.r-24,d.ai==='snake'?'Defeated!':'Eaten!','#9be37a');
  gainXP(Math.round(d.xp*(e.minion?.5:1)));
  const coins=Math.round(d.coins*(e.minion?.3:1)*(1+Math.min(pl?pl.combo:0,10)*.1));const n=Math.min(6,Math.ceil(coins/5));for(let i=0;i<n;i++)L.pickups.push({kind:'coin',val:Math.ceil(coins/n),x:e.x,y:e.y,vx:rnd(-120,120),vy:rnd(-120,120)});
  if(!e.minion&&!d.boss&&Math.random()<.08)L.pickups.push({kind:Math.random()<.5?'star':'pepper',x:e.x,y:e.y,vx:rnd(-80,80),vy:rnd(-80,80)});
  const sn=S.mode==='impossible'?0:(d.snack||(!e.minion&&Math.random()<.15?1:0));for(let i=0;i<sn;i++)L.pickups.push({kind:'snack',x:e.x,y:e.y,vx:rnd(-90,90),vy:rnd(-90,90)});
  if(d.drop==='diamond'){S.diamond=true;L.pickups.push({kind:'diamond',x:e.x,y:e.y,vx:0,vy:0})}
  if(d.boss){G.shake=.45;for(const m of L.enemies)if(m.minion&&!m.dead){m.dead=true;addParts(m.x,m.y,'#ffffff',8)}}}
function summon(e,keys){for(let k=0;k<2;k++){let x=e.x,y=e.y;const key=Array.isArray(keys)?keys[Math.floor(Math.random()*keys.length)]:keys;
    if(ENEMY[key].ai==='flyer'){const a=Math.random()*6.28;x=clamp(e.x+Math.cos(a)*220,24,L.mw*T-24);y=clamp(e.y+Math.sin(a)*220,24,L.mh*T-24)}
    else for(let tries=0;tries<10;tries++){const a=Math.random()*6.28;x=e.x+Math.cos(a)*(e.r+34);y=e.y+Math.sin(a)*(e.r+34);if(!blocked(x,y,14))break}
    spawn(key,x,y,true);addParts(x,y,'#ffffff',8)}
  addFloat(e.x,e.y-e.r-44,{snake:'Guards, get them!',sky:'Sky bananas, attack!',melon:'¡Amigos, ayuda!',apple:'Apples, roll out!',lantern:'Lanterns, burn bright!',plum:'Plums, freeze them!',ghostPear:'Rise, my ghosts!',oliveHoplite:'Guards! To the labyrinth!',gooseRoller:'Erupt, my children!',lycheeRunner:'Lychee squad, attack!',limeBit:'C0PY. P4STE. 4TT4CK.'}[keys]||(Array.isArray(keys)?'Fruits of every world, attack!':'Minions, help me!'),'#ffffff')}
function bossAttack(e,kind,ang,P){const d=e.def,mad=e.enraged;
  if(kind==='spread'){const n=mad?5:3;for(let k=0;k<n;k++)shoot(e.x,e.y,ang+(k-(n-1)/2)*.2,215,d.shot,d.shotDmg,d.shot==='venom'?.3:0)}
  if(kind==='ring'){const n=mad?14:10;for(let k=0;k<n;k++)shoot(e.x,e.y,k/n*Math.PI*2+e.t,165,d.shot,d.shotDmg,d.shot==='venom'?.3:0)}
  if(kind==='wave'){L.waves.push({x:e.x,y:e.y,rad:e.r,max:360,dmg:d.dmg,hit:false});G.shake=Math.max(G.shake,.3)}
  if(kind==='rain'){const n=mad?6:4;L.bombs.push({x:P.x,y:P.y,t:1.1,max:1.1,r:36,dmg:d.shotDmg+3,kind:d.rain});for(let k=1;k<n;k++){const t=rnd(.9,1.7);L.bombs.push({x:clamp(P.x+rnd(-150,150),20,L.mw*T-20),y:clamp(P.y+rnd(-120,120),20,L.mh*T-20),t,max:t,r:36,dmg:d.shotDmg+3,kind:d.rain})}}
  if(kind==='freeze'){for(let k=0;k<(mad?3:2);k++)L.patches.push({x:P.x+rnd(-110,110),y:P.y+rnd(-110,110),r:60,t:7})}
  if(kind==='summon'){if(L.enemies.filter(m=>m.minion&&!m.dead).length<(mad?3:2))summon(e,d.summon)}
  if(kind==='charge'){if(isPeeled(e)&&d.ai!=='dragon')return bossAttack(e,'spread',ang,P);e.windT=d.ai==='snake'?.3:.5}
  if(kind==='slam'){if(d.ai!=='walker')return bossAttack(e,'ring',ang,P);const tx=blocked(P.x,P.y,e.cr)?e.x:P.x,ty=blocked(P.x,P.y,e.cr)?e.y:P.y;e.slam={t:0,dur:1.05,fx:e.x,fy:e.y,tx,ty};e.windT=0;e.dashT=0}}

/* ================= Flow: dialog, travel, menus ================= */
function dialog(lines,done,src){G.mode='dialog';G.dlg={lines,i:0,done,src:src||'o'};G.keys={};showLine()}
function showLine(){const d=G.dlg,[who,text]=d.lines[d.i];$('#dlgWho').textContent=who;$('#dlgText').textContent=text;$('#dlgNext').textContent=(d.i<d.lines.length-1?'Next':'Start')+(TOUCH?' · tap':' · Space');dlg.hidden=false;G.dlgShownT=performance.now()}
function advance(){if(NET.role==='guest')return;if(G.mode==='travel'){nextLeg();return}if(G.mode!=='dialog'||!G.dlg)return;if(performance.now()-G.dlgShownT<180)return;
  const d=G.dlg;d.i++;if(d.i>=d.lines.length){dlg.hidden=true;G.dlg=null;G.mode='play';d.done&&d.done()}else showLine()}
function travel(legs,done){if(!legs||!legs.length)return done();G.mode='travel';G.trav={legs,i:0,start:G.t,done}}
function nextLeg(){const tr=G.trav;if(!tr)return;tr.i++;tr.start=G.t;if(tr.i>=tr.legs.length){G.trav=null;G.mode='play';tr.done()}}
function leaveLevel(){dialog(L.def.outro,()=>{S.level++;save();const nx=LEVELS[S.level];travel(nx.arrive,()=>loadLevel(S.level))},'o')}
function finishGame(){dialog(L.def.outro,()=>{S.done=true;save();showEnd()},'o')}
function showMenu(html,cls=''){menu.innerHTML=`<div class="card ${cls}">${html}</div>`;menu.hidden=false;G.keys={};G.joy={x:0,y:0};const b=menu.querySelector('button.primary:not(:disabled)')||menu.querySelector('button:not(:disabled)');if(b)b.focus({preventScroll:true})}
function hideMenu(){menu.hidden=true;menu.innerHTML=''}
function title(note){G.mode='title';G.menuKind='';L=null;PL=[];P=null;dlg.hidden=true;where.textContent='';const sv=loadSave();const can=sv&&!sv.done;
  showMenu(`<p class="eyebrow">A top-down banana adventure</p><h1>The Bananas of the Caribbean</h1>
  <p>Every banana in Europe has come alive and run off to the Caribbean. Fight your way from a little village to Rome, sail past the banana whales, battle the sky bananas, beat the Banana Boss and the Snake King, and peel the Final Banana with a diamond sword. Then the real trouble starts: watermelons in Mexico, Canada’s favorite apples, the tangerines of China, the kiwis of India, the grapes of France, the coconuts of Hawaii, the pineapples of Australia, the strawberries of Japan, the lemons of Egypt, the mangoes of Brazil, the papayas of Kenya, the oranges of South Africa, and the Frozen Plum of Antarctica. Then it is off to the Moon, Mars, Saturn, the Sun, the outer planets, a black hole, beyond the universe, and into the strange worlds between worlds.</p>
  ${note?`<p class="note" id="mNote"></p>`:''}
  <div class="row"><button class="btn primary" id="mNew">New adventure</button>${can?`<button class="btn" id="mCont">Continue<small>Chapter ${sv.level+1}, level ${sv.lvl}${sv.mode==='impossible'?', Impossible':''}</small></button>`:''}<button class="btn" id="mPick">Pick a chapter<small>Start from any chapter</small></button><button class="btn" id="mFriends">Play with friends<small>Online co-op, up to 4 players</small></button></div>`);
  if(note)$('#mNote').textContent=note;$('#mFriends').onclick=()=>mpMenu();$('#mPick').onclick=()=>pickMode(m=>chapterMenu(m));
  $('#mNew').onclick=()=>pickMode(m=>{hideMenu();S=NEW();S.mode=m;loadLevel(0)});if(can)$('#mCont').onclick=()=>{hideMenu();S=Object.assign(NEW(),sv);loadLevel(S.level)}}
function statsFor(i){const st=NEW(),lv=1+Math.round(i*1.6);st.lvl=lv;st.maxHp=40+10*(lv-1);st.atk=6+3*(lv-1);st.sword=i>=7;st.diamond=i===6;st.coins=Math.min(400,40*i);st.snacks=i?4:2;st.boots=i>=20;st.level=i;return st}
function startAt(i,mode){hideMenu();S=statsFor(i);S.mode=mode;PL=[];loadLevel(i)}
const PARTS=[[0,'Part 1: The Caribbean'],[8,'Part 2: Around the world'],[21,'Part 3: Outer space'],[31,'Part 4: Between worlds']];
function chapterMenu(mode){showMenu(`<p class="eyebrow">${mode==='impossible'?'Impossible mode':'Normal mode'}</p><h2>Pick a chapter</h2><p>Start anywhere in the story. Your hero starts at a level that fits that chapter.</p><div id="chList" class="chlist"></div><div class="row"><button class="btn" id="chBack">Back</button></div>`);
  const box=$('#chList');LEVELS.forEach((lv,i)=>{const part=PARTS.find(q=>q[0]===i);if(part){const h=document.createElement('h3');h.className='sub';h.textContent=part[1];box.append(h)}const b=document.createElement('button');b.className='btn';b.textContent=`${i+1}. ${lv.name}`;b.onclick=()=>startAt(i,mode);box.append(b)});
  $('#chBack').onclick=()=>title()}
function pickMode(go){showMenu(`<p class="eyebrow">New adventure</p><h2>Choose your difficulty</h2>
  <div class="shop"><button class="btn primary" id="pmN">Normal<small>The full story. It starts easy and gets much harder in later chapters.</small></button>
  <button class="btn imp" id="pmI">Impossible<small>Enemies have 3 times the health and hit 2.5 times as hard. They are faster, bosses attack nonstop, and nothing drops snacks. Good luck.</small></button></div>
  <div class="row"><button class="btn" id="pmB">Back</button></div>`);$('#pmN').onclick=()=>go('normal');$('#pmI').onclick=()=>go('impossible');$('#pmB').onclick=()=>title()}
function die(){G.mode='menu';G.menuKind='wipe';const name=(L.enemies.find(e=>e.def.boss&&!e.dead)||{}).def?.name;
  showMenu(`<p class="eyebrow">Knocked out</p><h2>${name?name+' wins this round':'The bananas got you'}</h2><p>${PL.length>1?'Your whole team':'You'} wake${PL.length>1?'s':''} up at the start of ${L.def.name} with full health. Remember: peel, then eat, and dash away from attacks.</p><div class="row"><button class="btn primary" id="mRetry">Try again</button></div>`);
  $('#mRetry').onclick=()=>{hideMenu();G.menuKind='';S=JSON.parse(L.snapshot);if(S.snacks<1)S.snacks=1;loadLevel(S.level,true)}}
function showEnd(){G.mode='menu';G.menuKind='end';showMenu(`<p class="eyebrow">The end</p><h2>Every evil fruit is eaten</h2><p>${S.mode==='impossible'?'You beat IMPOSSIBLE mode! ':''}You ate your way around the whole world, from the bananas of the Caribbean to the Frozen Plum of Antarctica, then blasted into space, ate your way past the Sun, Venus, Jupiter, Neptune, Pluto and a black hole, ate the Fruit of Everything beyond the edge of the universe, chased its seeds through five strange worlds, and finally defeated Fruitus Omega on the Fruit Throne. You finished at level ${S.lvl} with ${S.coins} coins.</p><div class="row"><button class="btn primary" id="mAgain">Play again</button></div>`);
  $('#mAgain').onclick=()=>{hideMenu();G.menuKind='';S=NEW();loadLevel(0)}}
const SHOP=[{id:'snack',name:'Coconut snack',desc:'Heals half your health.',cost:15},{id:'stone',name:'Whetstone',desc:'+3 strength for peeling and biting.',cost:40},{id:'belly',name:'Iron stomach',desc:'+12 max health.',cost:40},{id:'boots',name:'Grip boots',desc:'No more slipping on ice.',cost:60}];
let shopMsg='';
function openShop(){G.mode='menu';G.menuKind='shop';
  showMenu(`<p class="eyebrow">${L.def.goal==='shop'?'Merchant’s stall':'Trading post'}</p><h2>What will it be?</h2><p class="stats">${S.coins} coins · ${S.snacks} snacks · strength ${S.atk}${S.sword?' (+12 sword)':''} · max health ${S.maxHp}</p>
  ${S.sword?'<p><b>Diamond sword forged.</b> It adds 12 strength and peels twice as fast. Even the Final Banana can’t stop it.</p>':`<button class="btn primary" id="mForge" ${S.diamond?'':'disabled'}>Forge the diamond sword<small>Uses the Snake King’s diamond. The merchant does it for free.</small></button>`}
  <div class="shop">${SHOP.map(it=>{const own=it.id==='boots'&&S.boots;return`<button class="btn" data-buy="${it.id}" ${S.coins<it.cost||own?'disabled':''}>${it.name}<span class="cost">${own?'owned':it.cost+' coins'}</span><small>${it.desc}</small></button>`}).join('')}</div>
  <p class="note">${shopMsg||(L.def.goal==='shop'?'“Stock up before Banana Island, friend.”':'“Heading somewhere cold? Grip boots keep you on your feet.”')}</p>
  <div class="row"><button class="btn ${S.sword?'primary':''}" id="mLeave">Back to the adventure</button>${S.sword&&L.def.goal==='shop'?'<span class="stats">The ship is waiting at the dock.</span>':''}</div>`);
  const f=$('#mForge');if(f){f.onclick=()=>{S.sword=true;S.diamond=false;shopMsg='The merchant hammers the diamond into a glittering sword. It hums in your hand.';save();openShop()};f.focus({preventScroll:true})}
  menu.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=SHOP.find(x=>x.id===b.dataset.buy);if(S.coins<it.cost)return;S.coins-=it.cost;
    if(it.id==='snack'){S.snacks++;shopMsg='One coconut snack, wrapped in a leaf.'}if(it.id==='stone'){S.atk+=3;shopMsg='Your blade and your teeth feel sharper.'}if(it.id==='belly'){S.maxHp+=12;PL.forEach(p=>{if(!p.down)p.hp=S.maxHp});shopMsg='Your stomach feels like iron.'}if(it.id==='boots'){S.boots=true;shopMsg='Grip boots! Ice will not trip you up anymore.'}
    save();openShop();const nb=menu.querySelector(`[data-buy="${it.id}"]`);if(nb&&!nb.disabled)nb.focus({preventScroll:true})});
  $('#mLeave').onclick=()=>{hideMenu();shopMsg='';G.mode='play';G.menuKind='';if(S.sword&&L.def.goal==='shop')banner('Board the ship at the dock!')}}

const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyJ:'attack',Space:'attack',KeyK:'eat',KeyE:'eat',ShiftLeft:'dash',ShiftRight:'dash',KeyL:'dash',KeyQ:'snack',KeyR:'super',Enter:'ok'};
addEventListener('keydown',e=>{if(!menu.hidden||e.metaKey||e.ctrlKey||e.altKey)return;const a=KEYMAP[e.code];if(!a)return;
  if(G.mode==='dialog'||G.mode==='travel'){if(['attack','ok','eat'].includes(a)){e.preventDefault();if(!e.repeat)advance()}else if(['up','down','left','right'].includes(a))e.preventDefault();return}
  if(G.mode==='play'){e.preventDefault();if(!G.keys[a]&&!e.repeat)G.pressed.add(a);G.keys[a]=true}});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)G.keys[a]=false});
addEventListener('blur',()=>{G.keys={};G.joy={x:0,y:0}});
dlg.addEventListener('click',advance);
cv.addEventListener('pointerdown',()=>{if(G.mode==='dialog'||G.mode==='travel')advance()});
function enableTouch(){if($('#touch').hidden===false)return;TOUCH=true;$('#touch').hidden=false;$('#keys').hidden=true;$('#rotate').hidden=false}
const fsBtn=$('#fsBtn'),supBtn=$('#supBtn');if(document.fullscreenEnabled&&document.documentElement.requestFullscreen){fsBtn.hidden=false;fsBtn.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.documentElement.requestFullscreen({navigationUI:'hide'}).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})};document.addEventListener('fullscreenchange',()=>{fsBtn.textContent=document.fullscreenElement?'Exit full screen':'Full screen'})}

      pl.name=String(q.nm||'Friend').slice(0,14);banner(`${pl.name} joined the game!`)}
    seen.add(pr.peer);pl.name=String(q.nm||'Friend').slice(0,14);

function guestUpdate(dt){if(!L)return;

  const k=Math.min(1,dt*12);
  for(const e of NET.ents.values()){e.t+=dt;e.hitFlash-=dt;if(e.nx!=null){e.x+=(e.nx-e.x)*k;e.y+=(e.ny-e.y)*k}if(e.def.ai==='dragon'){e.trail.unshift([e.x,e.y]);if(e.trail.length>130)e.trail.length=130}if(e.dead)e.alpha-=dt*2.2;if(e.gone&&e.alpha<=0)NET.ents.delete(e.id)}

  for(const q of L.proj){q.x+=q.vx*dt;q.y+=q.vy*dt}
  for(const k of L.rocks||[]){k.x+=k.vx*dt;k.y+=k.vy*dt}
  for(const b of L.bombs)b.t=Math.max(0,b.t-dt);

  else{dlg.hidden=true;title(note)}}
$('#netLeave').addEventListener('click',()=>leaveGame());
function makeSupabaseRoom(cfg){
  const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false},realtime:{params:{eventsPerSecond:30}}});
  const me=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  const lobby=sb.channel('botc-lobby',{config:{presence:{key:me}}});
  let lobbyMe={},lobbyPeers=[],lobbyFns=[],lobbyReady=false;
  lobby.on('presence',{event:'sync'},()=>{const st=lobby.presenceState();lobbyPeers=Object.entries(st).map(([k,arr])=>({peer:k,sameTab:k===me,presence:arr[arr.length-1]||{}}));lobbyFns.forEach(f=>{try{f({peers:lobbyPeers})}catch(e){}})})
    .subscribe(st=>{if(st==='SUBSCRIBED'){lobbyReady=true;lobby.track(lobbyMe).catch(()=>{})}});
  return{kind:'sb',peers:()=>lobbyPeers,onPeers(fn){lobbyFns.push(fn);return()=>{lobbyFns=lobbyFns.filter(f=>f!==fn)}},
    async presence(patch){for(const [k,v] of Object.entries(patch)){if(v===null)delete lobbyMe[k];else lobbyMe[k]=v}if(lobbyReady)await lobby.track(lobbyMe)},
    join(name){return new Promise((resolve,reject)=>{
      const ch=sb.channel(name,{config:{broadcast:{self:false,ack:false}}}),others=new Map();let mine={},live=false,done=false;
      ch.on('broadcast',{event:'st'},({payload})=>{if(payload&&typeof payload.p==='string'&&payload.p!==me&&payload.s&&typeof payload.s==='object')others.set(payload.p,{presence:payload.s,at:performance.now()})});
      ch.on('broadcast',{event:'bye'},({payload})=>{if(payload&&typeof payload.p==='string')others.delete(payload.p)});
      const api={presence(patch){for(const [k,v] of Object.entries(patch)){if(v===null)delete mine[k];else mine[k]=v}if(!live)return Promise.resolve();return ch.send({type:'broadcast',event:'st',payload:{p:me,s:mine}}).then(()=>{})},
        peers(){const now=performance.now(),out=[{peer:me,sameTab:true,presence:mine}];for(const [k,v] of others){if(now-v.at>5000){others.delete(k);continue}out.push({peer:k,sameTab:false,presence:v.presence})}return out},
        async leave(){if(live){try{await ch.send({type:'broadcast',event:'bye',payload:{p:me}})}catch(e){}}live=false;await sb.removeChannel(ch)}};
      const timer=setTimeout(()=>{if(!done){done=true;sb.removeChannel(ch);reject(new Error('timeout'))}},10000);
      ch.subscribe(st=>{if(st==='SUBSCRIBED'&&!done){done=true;live=true;clearTimeout(timer);resolve(api)}else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!done){done=true;clearTimeout(timer);sb.removeChannel(ch);reject(new Error(st))}else if(st==='CLOSED')live=false})})}}}
(async()=>{try{if(window.SB_CONFIG&&window.supabase&&window.supabase.createClient)NET.room=makeSupabaseRoom(window.SB_CONFIG);else NET.room=window.claude&&window.claude.use?await window.claude.use('room'):null}catch(e){NET.room=null}
  if(NET.room){NET.room.onPeers(()=>renderLobby(),()=>{});if(!menu.hidden&&$('#mpMsg')&&$('#mpHostNew').disabled)mpMenu()}})();

/* ================= Loop ================= */
let last=0;
function frame(ts){const t=ts/1000,dt=Math.min(.05,last?t-last:0);last=t;G.t=t;
  if(NET.role==='guest')guestUpdate(dt);else if(G.mode==='play'&&L)update(dt);
  netTick();
  G.shake=Math.max(0,G.shake-dt);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt}G.parts=G.parts.filter(p=>p.life>0);
  G.floats=G.floats.filter(f=>G.t-f.t0<1.1);
  document.body.classList.toggle('talking',!dlg.hidden);
  supBtn.classList.toggle('ready',!!(P&&(P.sup||0)>=100));
  render();G.pressed.clear();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
title();
</script>
